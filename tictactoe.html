<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1a1a2e;
      font-family: 'Segoe UI', sans-serif;
      color: #eee;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      letter-spacing: 2px;
      color: #e94560;
    }

    #status {
      font-size: 1.2rem;
      margin-bottom: 1.5rem;
      min-height: 1.8rem;
      color: #a8dadc;
    }

    #board {
      display: grid;
      grid-template-columns: repeat(3, 110px);
      grid-template-rows: repeat(3, 110px);
      gap: 8px;
    }

    .cell {
      background: #16213e;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      user-select: none;
    }

    .cell:hover:not(.taken) {
      background: #0f3460;
      transform: scale(1.05);
    }

    .cell.taken { cursor: default; }

    .cell.x { color: #e94560; }
    .cell.o { color: #a8dadc; }

    .cell.win { background: #0f3460; animation: pulse 0.6s ease infinite alternate; }

    @keyframes pulse {
      from { background: #0f3460; }
      to   { background: #1a4a7a; }
    }

    #controls {
      margin-top: 1.8rem;
      display: flex;
      gap: 12px;
    }

    button {
      padding: 0.6rem 1.6rem;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }

    button:hover { opacity: 0.85; transform: scale(1.04); }

    #restart { background: #e94560; color: #fff; }
    #toggle-mode { background: #a8dadc; color: #1a1a2e; }

    #scoreboard {
      margin-top: 1.5rem;
      display: flex;
      gap: 2rem;
      font-size: 1rem;
      color: #aaa;
    }

    #scoreboard span { font-weight: bold; color: #eee; }
  </style>
</head>
<body>

<h1>Tic Tac Toe</h1>
<div id="status">Player X's turn</div>

<div id="board">
  <div class="cell" data-i="0"></div>
  <div class="cell" data-i="1"></div>
  <div class="cell" data-i="2"></div>
  <div class="cell" data-i="3"></div>
  <div class="cell" data-i="4"></div>
  <div class="cell" data-i="5"></div>
  <div class="cell" data-i="6"></div>
  <div class="cell" data-i="7"></div>
  <div class="cell" data-i="8"></div>
</div>

<div id="controls">
  <button id="restart">Restart</button>
  <button id="toggle-mode">vs Computer</button>
</div>

<div id="scoreboard">
  X wins: <span id="x-wins">0</span>
  &nbsp;|&nbsp;
  O wins: <span id="o-wins">0</span>
  &nbsp;|&nbsp;
  Draws: <span id="draws">0</span>
</div>

<script>
  const WINS = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

  let board, current, gameOver, vsComputer;
  let score = { X: 0, O: 0, D: 0 };

  const cells    = document.querySelectorAll('.cell');
  const status   = document.getElementById('status');
  const xWinsEl  = document.getElementById('x-wins');
  const oWinsEl  = document.getElementById('o-wins');
  const drawsEl  = document.getElementById('draws');
  const modeBtn  = document.getElementById('toggle-mode');

  vsComputer = false;

  function init() {
    board    = Array(9).fill(null);
    current  = 'X';
    gameOver = false;
    cells.forEach(c => { c.textContent = ''; c.className = 'cell'; });
    status.textContent = "Player X's turn";
  }

  function checkWinner(b) {
    for (const [a, m, z] of WINS) {
      if (b[a] && b[a] === b[m] && b[a] === b[z]) return { winner: b[a], line: [a, m, z] };
    }
    if (b.every(Boolean)) return { winner: 'draw' };
    return null;
  }

  function applyMove(i, player) {
    board[i] = player;
    cells[i].textContent = player;
    cells[i].classList.add('taken', player.toLowerCase());
  }

  function endGame(result) {
    gameOver = true;
    if (result.winner === 'draw') {
      status.textContent = "It's a draw!";
      score.D++;
      drawsEl.textContent = score.D;
    } else {
      const label = vsComputer && result.winner === 'O' ? 'Computer' : `Player ${result.winner}`;
      status.textContent = `${label} wins!`;
      result.line.forEach(i => cells[i].classList.add('win'));
      score[result.winner]++;
      xWinsEl.textContent = score.X;
      oWinsEl.textContent = score.O;
    }
  }

  function minimax(b, isMax) {
    const r = checkWinner(b);
    if (r) return r.winner === 'O' ? 10 : r.winner === 'X' ? -10 : 0;
    const moves = b.map((v,i) => v ? null : i).filter(i => i !== null);
    if (isMax) {
      let best = -Infinity;
      for (const i of moves) {
        b[i] = 'O'; best = Math.max(best, minimax(b, false)); b[i] = null;
      }
      return best;
    } else {
      let best = Infinity;
      for (const i of moves) {
        b[i] = 'X'; best = Math.min(best, minimax(b, true)); b[i] = null;
      }
      return best;
    }
  }

  function bestMove() {
    const moves = board.map((v,i) => v ? null : i).filter(i => i !== null);
    let best = -Infinity, choice = moves[0];
    for (const i of moves) {
      board[i] = 'O';
      const score = minimax(board, false);
      board[i] = null;
      if (score > best) { best = score; choice = i; }
    }
    return choice;
  }

  function handleClick(i) {
    if (gameOver || board[i]) return;
    if (vsComputer && current === 'O') return;

    applyMove(i, current);
    const result = checkWinner(board);
    if (result) { endGame(result); return; }

    current = current === 'X' ? 'O' : 'X';

    if (vsComputer && current === 'O') {
      status.textContent = 'Computer thinking…';
      setTimeout(() => {
        const move = bestMove();
        applyMove(move, 'O');
        const r2 = checkWinner(board);
        if (r2) { endGame(r2); return; }
        current = 'X';
        status.textContent = "Player X's turn";
      }, 300);
    } else {
      const label = vsComputer ? 'Player X' : `Player ${current}`;
      status.textContent = `${label}'s turn`;
    }
  }

  cells.forEach(c => c.addEventListener('click', () => handleClick(+c.dataset.i)));

  document.getElementById('restart').addEventListener('click', init);

  modeBtn.addEventListener('click', () => {
    vsComputer = !vsComputer;
    modeBtn.textContent = vsComputer ? 'vs Human' : 'vs Computer';
    score = { X: 0, O: 0, D: 0 };
    xWinsEl.textContent = oWinsEl.textContent = drawsEl.textContent = 0;
    init();
  });

  init();
</script>
</body>
</html>
